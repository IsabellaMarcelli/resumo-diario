name: Resumo diário

on:
  schedule:
    # Cron do GitHub é em UTC: 10:00 UTC = 07:00 em Brasília
    - cron: "0 10 * * *"
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write # necessário para fazer commit do relatório

jobs:
  resumo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Gerar resumo
        run: python resumo.py

      - name: Salvar relatório no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add relatorios/ historico.json README.md
          git diff --cached --quiet || git commit -m "Resumo de $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          git push
